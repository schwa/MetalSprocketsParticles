[defaults]
container = "MetalSprocketsParticles"
skip_plugin_validation = true

[defaults.build]
scheme = "MetalSprocketsParticlesDemo"

[defaults.test]
scheme = "MetalSprocketsParticles"
# Not worth unit testing (#180): SwiftUI previews, and ParticleView's SwiftUI glue (its state is in ParticleViewState.swift, tested).
coverage_exclude = ["Sources/**/*+Previews.swift", "Sources/MetalSprocketsParticlesUI/ParticleView.swift"]

[defaults.run]
scheme = "MetalSprocketsParticlesDemo"
