# Generated by: xcb ci generate --target buildkite --warnings-as-errors --no-parallel
# Then edited (#230): a validation + capture test step, the demo support package tests, the demo app on macOS and iOS
# devices (#233; visionOS is not verified yet, and the iOS Simulator SDK has no Metal 4), and MetalSprockets' GPU
# concurrency group, so GPU suites from both repos never share the machine at once.
agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS, {{matrix.configuration}})"
    key: "test"
    concurrency: 1
    concurrency_group: "metalsprockets/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    matrix:
      setup:
        configuration:
          - "debug"
          - "release"
    command:
      - "swift build -c {{matrix.configuration}} -Xswiftc -warnings-as-errors --disable-sandbox"
      - "swift test -c {{matrix.configuration}} -Xswiftc -enable-testing -Xswiftc -warnings-as-errors --disable-sandbox --no-parallel"

  # Not generated by xcb. Xcode Debug runs turn on GPU frame capture as well as API validation, and some failures
  # happen only under capture (MetalSprockets #542). Metal reads these variables once per process, so this is a
  # separate step. Scripts/test-metal-layers.sh runs the same configurations locally.
  - label: ":metal: Test (macOS, debug, validation + capture)"
    key: "test-capture"
    concurrency: 1
    concurrency_group: "metalsprockets/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
      MTL_CAPTURE_ENABLED: "1"
    command:
      - "swift build -c debug -Xswiftc -warnings-as-errors --disable-sandbox"
      - "swift test -c debug -Xswiftc -enable-testing -Xswiftc -warnings-as-errors --disable-sandbox --no-parallel"

  - label: ":swift: Demo support tests"
    key: "demo-support"
    concurrency: 1
    concurrency_group: "metalsprockets/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    command:
      - "cd Demos/MetalSprocketsParticlesDemo/Packages/MetalSprocketsParticlesDemoSupport && swift test --disable-sandbox --no-parallel"

  - label: ":hammer: Demo app ({{matrix.destination}}, {{matrix.configuration}})"
    key: "demo"
    matrix:
      setup:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
        configuration:
          - "Debug"
          - "Release"
    command:
      - rm -rf .ci-spm
      - >-
        xcodebuild build
        -project Demos/MetalSprocketsParticlesDemo/MetalSprocketsParticlesDemo.xcodeproj
        -scheme MetalSprocketsParticlesDemo
        -configuration '{{matrix.configuration}}'
        -destination '{{matrix.destination}}'
        -clonedSourcePackagesDirPath .ci-spm
        -skipPackagePluginValidation
        -skipMacroValidation
        CODE_SIGNING_ALLOWED=NO
