# Generated with swiftlint-autodetect (counts from Sources and Tests), then curated: strict, minus rules that are a
# burden. Commented-out rules are deliberately off; the count shows how many violations they had.

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"
  - "**/Package.swift"
  - Demos # The demo app has its own config.

type_name:
  allowed_symbols: ["_"]
  excluded: [ID]

# The code base puts a comma after the last element of multi-line collections, for cleaner diffs.
trailing_comma:
  mandatory_comma: true

